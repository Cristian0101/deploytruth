# DeployTruth checks declared topology against observations. Never put token or secret values here.
version: 1
project: meridia

environments:
  production:
    kind: production
    source:
      provider: github
      repository: acme/meridia
      branch: main
    deployment:
      provider: vercel
      project: meridia
      stable_domain: https://meridia.example.com
    database:
      provider: supabase
      project_ref: prodabc123
      migrations:
        directory: supabase/migrations
    runtime:
      url: https://meridia.example.com/api/version
      expected_environment: production
    required_environment_variables:
      - SUPABASE_URL
      - NEXT_PUBLIC_SUPABASE_URL
    checks:
      local_git: true
      deployment_sha: true
      migrations: true
      runtime_identity: true
      environment_isolation: true
      environment_variables: true

  preview:
    kind: preview
    source:
      provider: github
      repository: acme/meridia
      branch: main
    deployment:
      provider: vercel
      project: meridia
    database:
      provider: supabase
      project_ref: previewabc123
    checks:
      deployment_sha: true
      environment_isolation: true
