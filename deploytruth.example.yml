# DeployTruth checks declared topology against observations. Never put token or secret values here.
version: 1
project: example-app

environments:
  production:
    kind: production
    source:
      provider: github
      repository: example/example-app
      branch: main
    deployment:
      provider: vercel
      project: example-app
      target: production
      domain: example-app.example.com
    database:
      provider: supabase
      project_ref: prodabc123
      migrations:
        directory: examples/live-acceptance/supabase/migrations
    runtime:
      url: https://example-app.example.com/api/version
      expected_environment: production
    required_environment_variables:
      - SUPABASE_URL
      - NEXT_PUBLIC_SUPABASE_URL
    checks:
      local_git: true
      remote_source: true
      deployment_sha: true
      migrations: true
      runtime_identity: true
      environment_isolation: true
      environment_variables: true

  preview:
    kind: preview
    source:
      provider: github
      repository: example/example-app
      branch: main
    deployment:
      provider: vercel
      project: example-app
    database:
      provider: supabase
      project_ref: previewabc123
    checks:
      deployment_sha: true
      environment_isolation: true
