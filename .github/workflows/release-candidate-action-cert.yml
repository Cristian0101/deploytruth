name: Release Candidate Remote Action Certification

# Isolated release QA only: prove that a consumer can invoke the immutable RC commit through
# GitHub's remote `uses:` resolution. This harness is not part of the release candidate and must
# not be merged. It checks out protected main as the application under test and certifies only
# local Git plus public GitHub source truth, so no repository secrets are exposed to PR code.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  certify-remote-action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Create credential-free consumer manifest
        shell: bash
        run: |
          set -euo pipefail
          cat > release-candidate-action-cert.yml <<'YAML'
          version: 1
          project: deploytruth-remote-action-consumer
          environments:
            certification:
              kind: production
              source:
                provider: github
                repository: Cristian0101/deploytruth
                branch: main
              checks:
                local_git: true
                remote_source: true
                deployment_sha: false
                migrations: false
                runtime_identity: false
                environment_isolation: false
                environment_variables: false
          YAML

      - name: Certify the immutable RC through remote uses
        id: deploytruth
        uses: Cristian0101/deploytruth@80a39424b7523d131c4c4d1b15cc1bbd0e01400c
        with:
          environment: certification
          config: release-candidate-action-cert.yml
          fail-on: fail
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify remote Action outputs
        env:
          VERDICT: ${{ steps.deploytruth.outputs.verdict }}
          RUN_ID: ${{ steps.deploytruth.outputs.run-id }}
          REPORT_PATH: ${{ steps.deploytruth.outputs.report-path }}
          SUMMARY_PATH: ${{ steps.deploytruth.outputs.summary-path }}
          METADATA_PATH: ${{ steps.deploytruth.outputs.metadata-path }}
          ARTIFACT_DIR: ${{ steps.deploytruth.outputs.artifact-directory }}
        shell: bash
        run: |
          set -euo pipefail
          test "$VERDICT" = PASS
          echo "$RUN_ID" | grep -Eq '^[0-9A-HJKMNP-TV-Z]{26}$'
          test -f "$REPORT_PATH"
          test -f "$SUMMARY_PATH"
          test -f "$METADATA_PATH"
          test -d "$ARTIFACT_DIR"

      - name: Upload remote Action evidence
        uses: actions/upload-artifact@v7
        with:
          name: deploytruth-remote-action-${{ steps.deploytruth.outputs.run-id }}
          path: ${{ steps.deploytruth.outputs.artifact-directory }}
          retention-days: 7
          if-no-files-found: error
