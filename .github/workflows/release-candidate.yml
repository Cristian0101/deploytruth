name: Release Candidate

# This workflow certifies a package artifact. It has no registry credentials, OIDC permission,
# release permission, tag mutation, or publish command.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22.23.2
  PNPM_VERSION: 11.19.0
  TARBALL_NAME: deploytruth-0.1.0.tgz

jobs:
  package:
    name: Package RC tarball
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify the committed Action bundle matches its sources
        run: git diff --exit-code -- packages/github-action/dist
      - name: Build and inspect the npm tarball
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/deploytruth-rc"
          mkdir -p "$destination"
          pnpm --filter ./packages/cli pack --pack-destination "$destination"
          test -f "$destination/$TARBALL_NAME"
          node scripts/pack-check.mjs
          TARBALL_PATH="$destination/$TARBALL_NAME" node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { readFileSync, statSync } from "node:fs";
            const path = process.env.TARBALL_PATH;
            const bytes = readFileSync(path);
            const sha256 = createHash("sha256").update(bytes).digest("hex");
            console.log(`tarball: ${path}`);
            console.log(`bytes: ${statSync(path).size}`);
            console.log(`sha256: ${sha256}`);
            await import("node:fs").then(({ appendFileSync }) =>
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## RC package\n\n- File: \`${process.env.TARBALL_NAME}\`\n- Bytes: \`${statSync(path).size}\`\n- SHA-256: \`${sha256}\`\n`),
            );
          '
      - name: Upload only the RC tarball
        uses: actions/upload-artifact@v7
        with:
          name: deploytruth-0.1.0-rc
          path: ${{ runner.temp }}/deploytruth-rc/deploytruth-0.1.0.tgz
          retention-days: 7
          if-no-files-found: error

  consumer:
    name: Consumer (${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # Checkout supplies only the smoke harness. There is deliberately no dependency install in
      # this job; the harness creates an empty project under RUNNER_TEMP and installs only the tgz.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with:
          name: deploytruth-0.1.0-rc
          path: ${{ runner.temp }}/deploytruth-rc
      - name: Record downloaded tarball SHA-256
        shell: bash
        run: |
          set -euo pipefail
          TARBALL_PATH="$RUNNER_TEMP/deploytruth-rc/$TARBALL_NAME" node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { readFileSync } from "node:fs";
            const sha256 = createHash("sha256").update(readFileSync(process.env.TARBALL_PATH)).digest("hex");
            console.log(`downloaded sha256: ${sha256}`);
          '
      - name: Install and certify from an empty external project
        run: node scripts/external-consumer-smoke.mjs "$RUNNER_TEMP/deploytruth-rc/$TARBALL_NAME"
